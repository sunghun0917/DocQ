spring.profiles.default=local

spring.application.name=docq_backend
server.port=8081

# Timezone: JPA/Hibernate가 DATETIME 저장·조회할 때만 사용 (게임 타이밍은 System.currentTimeMillis() 사용으로 영향 없음)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# File Size Limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Game event poller
game.events.poll-interval-ms=200

# Datasource
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false