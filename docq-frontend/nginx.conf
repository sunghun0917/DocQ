server {
    listen 80;

    location ^~ /api/ { return 404; }
    location ^~ /ws-docq { return 404; }
    location ~ /\.(git|env|svn|hg)(/|$) { return 404; }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @go_home;
    }

    location @go_home {
        return 302 /;
    }
}