server {
    listen 80;

    location /api/ { return 404; }
    location /ws-docq { return 404; }
    location = /game { return 404; }
    location ^~ /game/ { return 404; }
    location ~ /\.(git|env|svn|hg) { deny all; return 404; }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}