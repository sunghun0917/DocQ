services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/jenkins-data/workspace/cicd_master/deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - /home/ubuntu/jenkins-data/workspace/cicd_master/deploy/nginx/common.conf:/etc/nginx/common.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - docq-network

  backend:
    build: ../../docq_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ai.url=http://ai-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - docq-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - docq-network

  frontend:
    build: ../../docq-frontend
    restart: unless-stopped
    networks:
      - docq-network

  ai-redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    # appendonly 없음 = 재시작 시 데이터 초기화
    networks:
      - docq-network

  ai-service:
    build: ../../docq-ai
    restart: unless-stopped
    env_file:
      - ../../docq-ai/.env
    environment:
      - PYTHONUNBUFFERED=1
      - MINERU_HOST=${EC2_HOST_IP}
      - REDIS_HOST=ai-redis
      - REDIS_PORT=6379
      - BACKEND_CALLBACK_URL=http://backend:8081/ai/callback
    depends_on:
      - ai-redis
    networks:
      - docq-network

  # --- 모니터링 서비스 추가 ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - /home/ubuntu/jenkins-data/workspace/cicd_master/deploy/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # SSH 터널링용 로컬 바인딩
    networks:
      - docq-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000" # SSH 터널링용 로컬 바인딩
    networks:
      - docq-network

networks:
  docq-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data: # 데이터 보존용
  grafana-data: # 데이터 보존용
