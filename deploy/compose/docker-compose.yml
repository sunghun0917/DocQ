
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - docq-network

  backend:
    build: ../../docq_backend
    restart: unless-stopped
    environment:
#      - SPRING_PROFILES_ACTIVE=prod
      - ai.url=http://ai-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - docq-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - docq-network

  frontend:
    build: ../../docq-frontend
    restart: unless-stopped
    networks:
      - docq-network

  ai-service:
    build: ../../docq-ai
    restart: unless-stopped
    env_file:
      - ../../docq-ai/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - docq-network

networks:
  docq-network:
    driver: bridge

volumes:
  redis-data: