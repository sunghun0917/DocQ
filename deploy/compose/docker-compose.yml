services:
  backend:
    build: ../../docq_backend
    container_name: docq-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ai.url=http://ai-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - docq-network

  frontend:
    build: ../../docq-frontend
    container_name: docq-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - docq-network

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - docq-network

  ai-service:
    build: ../../docq-ai
    container_name: docq-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../docq-ai/.env
    environment:
      - PYTHONUNBUFFERED=1
      - MINERU_API_URL=http://mineru-api:18000/file_parse
    depends_on:
      - mineru-api
    networks:
      - docq-network

  mineru-api:
    image: mineru:latest
    container_name: mineru-api
    restart: unless-stopped
    ports:
      - "18000:18000"
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 18000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - docq-network

networks:
  docq-network:
    driver: bridge
