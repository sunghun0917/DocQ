
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - docq-network

  backend:
    build: ../../docq_backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ai.url=http://ai-service:8000
    networks:
      - docq-network

  frontend:
    build: ../../docq-frontend
    restart: unless-stopped
    networks:
      - docq-network

  ai-service:
    build: ../../docq-ai
    restart: unless-stopped
    env_file:
      - ../../docq-ai/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - docq-network

networks:
  docq-network:
    driver: bridge
