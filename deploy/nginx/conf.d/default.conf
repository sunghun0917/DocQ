server {
    listen 80;
    server_name i14d209.p.ssafy.io docq.site www.docq.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name i14d209.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/i14d209.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i14d209.p.ssafy.io/privkey.pem;

    include /etc/nginx/common.conf;
}

server {
    listen 443 ssl;
    server_name docq.site www.docq.site;

    ssl_certificate     /etc/letsencrypt/live/docq.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docq.site/privkey.pem;

    include /etc/nginx/common.conf;
}
