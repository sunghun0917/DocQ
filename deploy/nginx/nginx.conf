events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    upstream backend {
        server backend:8081;
    }

    upstream ai_service {
        server ai-service:8000;
    }

    server {
        listen 80;
        server_name i14d209.p.ssafy.io;
        return 301 https://$host$request_uri;
    }

    server {
        # SSL config
        listen 443 ssl;
        server_name i14d209.p.ssafy.io;

        ssl_certificate     /etc/letsencrypt/live/i14d209.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i14d209.p.ssafy.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location ~ /\.(git|env|svn|hg) {
            deny all;
            return 404;
        }

        # Frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Backend API
        location /api/ {
            # Strip /api prefix when forwarding to backend
            proxy_pass http://backend/;

            // nginx API time out 5분
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            send_timeout          300s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket for backend (STOMP over SockJS)
        location /ws-docq {
            proxy_pass http://backend/ws-docq;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI Service
        location /ai/ {
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}
